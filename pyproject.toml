[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rsr"
version = "0.1.0"
description = "Real-to-Sim scene reconstruction: video perception, robot registration, Blender refinement and MuJoCo physical checks"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "trimesh>=4", "pycollada>=0.8", "python-dotenv>=1", "PyYAML>=6"]

[project.optional-dependencies]
local = [
    "numpy>=1.26,<2", "opencv-python<4.12",
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.6.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "torchvision==0.21.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "vggt-omega==0.0.1", "ultralytics==8.4.160", "clip", "timm>=1", "huggingface-hub>=0.27",
]
sim = ["mujoco>=3.2.7", "Pillow>=10", "robot-control"]
agent = ["openai-codex>=0.154.0"]
dev = ["pytest>=8"]

[project.scripts]
real2sim = "real2sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["real2sim", "real2sim.*"]

[tool.setuptools.package-data]
"real2sim.stage1" = ["thresholds.json"]
"real2sim.stage3" = ["agent_prompt.md", "force_prior_prompt.md", "semantics_prompt.md"]
"real2sim.stage2" = ["agent_prompt.md", "plan_prompt.md", "geometry_prompt.md", "refinement_prompt.md"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["src", "."]
markers = ["models: real checkpoint inference requiring local weights and a CUDA GPU", "end_to_end: opt-in video-to-scene run using real models and paid agent calls"]

[tool.uv.sources]
vggt-omega = { path = "external/vggt_omega", editable = true }
ultralytics = { path = "external/ultralytics", editable = true }
robot-control = { path = "external/robot_control", editable = true }
clip = { url = "https://github.com/ultralytics/CLIP/archive/7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40.zip" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
